---
- name: Disable swap at runtime
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Disable swap permanently in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Create containerd and kubernetes module config file
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Load overlay module
  community.general.modprobe:
    name: overlay
    state: present

- name: Load br_netfilter module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Set sysctl parameters for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
      net.ipv6.conf.all.forwarding        = 1
      net.ipv6.conf.default.forwarding    = 1
    mode: '0644'

- name: Apply sysctl parameters without reboot
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - python3-debian
    state: present
    update_cache: true

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Get default containerd configuration
  ansible.builtin.command: containerd config default
  register: k8s_prep_containerd_config_default
  changed_when: false

- name: Generate default containerd configuration with SystemdCgroup
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ k8s_prep_containerd_config_default.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') | regex_replace('sandbox_image = \".*\"', 'sandbox_image = \"' ~ kubernetes_pause_image ~ '\"') }}\n"
    mode: '0644'
  notify: Restart containerd

- name: Apply containerd configuration before kubeadm
  ansible.builtin.meta: flush_handlers

- name: Download Kubernetes apt-key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Remove legacy Kubernetes repository definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/kubernetes.list
    state: absent

- name: Add Kubernetes apt repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types:
      - deb
    uris:
      - "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/"
    suites:
      - "/"
    signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: present
    enabled: true

- name: Install kubelet, kubeadm, and kubectl
  ansible.builtin.apt:
    name:
      - kubelet={{ kubernetes_package_version }}
      - kubeadm={{ kubernetes_package_version }}
      - kubectl={{ kubernetes_package_version }}
    state: present
    update_cache: true

- name: Hold Kubernetes packages to prevent accidental upgrades
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
