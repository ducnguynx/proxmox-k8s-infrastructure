---
- name: Get a fresh join command from the control plane
  ansible.builtin.command: kubeadm token create --print-join-command
  delegate_to: "{{ groups['control_nodes'][0] }}"
  run_once: true
  register: join_worker_nodes_worker_join_command
  changed_when: false

- name: Join the worker node to the cluster
  ansible.builtin.command: "{{ join_worker_nodes_worker_join_command.stdout }}"
  args:
    creates: /etc/kubernetes/kubelet.conf
