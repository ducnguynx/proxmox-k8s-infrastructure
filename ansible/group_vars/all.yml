---
kubernetes_version: "1.30.14"
kubernetes_minor_version: "{{ kubernetes_version | regex_replace('^([0-9]+\\.[0-9]+).*$', '\\1') }}"
kubernetes_package_version: "{{ kubernetes_version }}-1.1"
kubernetes_pause_image: "registry.k8s.io/pause:3.9"

kube_vip_address: "192.168.1.200"
kube_vip_interface: "eth0"
kube_vip_subnet: "32"
kube_vip_version: "v1.2.0-rc.0"
kube_vip_manifests_dir: "/etc/kubernetes/manifests"
